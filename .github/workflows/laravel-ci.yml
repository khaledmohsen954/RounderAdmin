name: Laravel checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_password
          MYSQL_DATABASE: rounder_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci_password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ${{ matrix.database == 'mysql' && 'rounder_test' || ':memory:' }}
      DB_USERNAME: root
      DB_PASSWORD: ci_password
      APP_ENV: testing
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan route:list
      - name: Verify schema and reference data
        run: php artisan migrate:fresh --seed --force
      - name: Run API and administrative workflow tests
        run: vendor/bin/phpunit
      - name: Compile dashboard views
        run: php artisan view:cache
