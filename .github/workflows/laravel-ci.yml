name: Laravel checks
on:
  push:
    branches: [main, refactor/domain-modules, feature/dynamic-catalog, feature/provider-forms]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_password
          MYSQL_DATABASE: rounder_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci_password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: rounder_test
      DB_USERNAME: root
      DB_PASSWORD: ci_password
      APP_ENV: testing
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, gd
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Check PHP syntax across all modules
        run: find app routes tests database -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php artisan route:list
      - name: Verify schema and reference data
        run: php artisan migrate:fresh --seed --force
      - name: Run API and administrative workflow tests
        run: vendor/bin/phpunit
      - name: Compile dashboard views
        run: php artisan view:cache

      - name: Install isolated browser test tooling
        run: |
          npm install --prefix /tmp/rounder-browser --no-audit --no-fund playwright@1.56.1
          /tmp/rounder-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Check responsive admin forms and confirmation dialogs
        env:
          SESSION_DRIVER: file
          ROUND_ADMIN_EMAIL: admin-ui@example.test
          ROUND_ADMIN_PASSWORD: StrongBrowserPassword123!
          PLAYWRIGHT_MODULE: /tmp/rounder-browser/node_modules/playwright/index.mjs
        run: |
          php artisan db:seed --force
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/browser-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/admin/login > /dev/null && break || sleep 1; done
          node tests/Browser/admin-ui.mjs
      - name: Upload dashboard screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-browser-checks
          path: |
            tests/browser-artifacts/
            storage/logs/browser-server.log
          retention-days: 7
